services:
  postgres:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: ${OMS_DB_NAME:-oms}
      POSTGRES_USER: ${OMS_DB_USER:-oms}
      POSTGRES_PASSWORD: ${OMS_DB_PASSWORD:?Copy .env.example to .env and set a local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - oms-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading-oms:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${OMS_DB_NAME:-oms}
      SPRING_DATASOURCE_USERNAME: ${OMS_DB_USER:-oms}
      SPRING_DATASOURCE_PASSWORD: ${OMS_DB_PASSWORD:?Copy .env.example to .env and set a local database password}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  oms-data:
